name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.23.4', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm test:plugins
      - run: pnpm schema && git diff --exit-code schema/plugin-v1.json
      - run: git diff --exit-code plugins/guard/dist/guard.mjs test/fixtures/plugins/echo/server.mjs test/fixtures/plugins/echo/crash.mjs
      - run: pnpm audit --prod --audit-level high
      - run: node scripts/check-licenses.mjs
