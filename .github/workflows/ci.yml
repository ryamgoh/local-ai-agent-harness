name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# Keep this distinct from the caller's release concurrency group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Node ${{ matrix.node }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.23.4', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare diagnostics
        run: mkdir -p "$RUNNER_TEMP/ci-diagnostics"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Activate the same interpreter on PATH for the offline uv subprocess tests.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/install.log"
      - name: Check version consistency
        run: pnpm version:check 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/version.log"
      - name: Test version validation and bump behavior
        run: pnpm test:version 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/version-tests.log"
      - name: Build
        run: pnpm build 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/build.log"
      - name: Lint and formatting
        run: pnpm lint 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/lint.log"
      - name: Typecheck
        run: pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/typecheck.log"
      - name: Tests and coverage (local providers only)
        run: pnpm test:coverage 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/coverage.log"
      - name: Plugin contract tests (no provider billing)
        run: pnpm test:plugins 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/plugins.log"
      - name: Verify generated schema is committed
        run: |
          {
            pnpm schema
            git diff --exit-code schema/plugin-v1.json
          } 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/schema.log"
      - name: Verify generated plugin bundles are committed
        run: |
          git diff --exit-code plugins/guard/dist/guard.mjs test/fixtures/plugins/echo/server.mjs test/fixtures/plugins/echo/crash.mjs 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/bundles.log"
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/audit.log"
      - name: Check dependency licenses
        run: node scripts/check-licenses.mjs 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/licenses.log"
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}-node-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/ci-diagnostics/*.log
            coverage/
          if-no-files-found: warn
          retention-days: 7

  packaging:
    name: Build and smoke-test distribution
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare diagnostics
        run: mkdir -p "$RUNNER_TEMP/ci-diagnostics"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/install.log"
      - name: Build release files
        run: pnpm build:release 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/build-release.log"
      - name: Validate distribution files and source archive hygiene
        run: |
          python - <<'PY' 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/archive.log"
          import json
          from pathlib import Path, PurePosixPath
          import zipfile

          version = json.loads(Path('package.json').read_text())['version']
          directory = Path('release')
          files = list(directory.iterdir())
          sources = list(directory.glob('*.zip'))
          package = directory / f'local-ai-agent-harness-{version}.tgz'
          if len(sources) != 1 or set(files) != {package, directory / 'SHA256SUMS', *sources}:
              raise SystemExit('Expected exactly the versioned package, one source ZIP, and SHA256SUMS')
          if any(not path.is_file() or path.is_symlink() for path in files):
              raise SystemExit('Distribution files must be regular files, not symlinks')
          excluded = {'node_modules', '.git', '.harness', '.venv', '__pycache__', '.pytest_cache'}
          with zipfile.ZipFile(sources[0]) as archive:
              if archive.testzip() is not None:
                  raise SystemExit('Source ZIP integrity check failed')
              for entry in archive.infolist():
                  path = PurePosixPath(entry.filename)
                  if path.is_absolute() or '..' in path.parts or '\\' in entry.filename:
                      raise SystemExit(f'Unsafe source ZIP path: {entry.filename}')
                  if excluded.intersection(path.parts):
                      raise SystemExit(f'Excluded source ZIP path: {entry.filename}')
                  if ((path.name.startswith('.env') and path.name != '.env.example')
                      or path.name.endswith(('.secrets.json', '.pem', '.key'))):
                      raise SystemExit(f'Credential-like source ZIP path: {entry.filename}')
                  if (entry.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit(f'Source ZIP symlink: {entry.filename}')
          print('Distribution layout and source archive hygiene passed')
          PY
          (cd release && sha256sum --check --strict SHA256SUMS) 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/checksums.log"
      - name: Smoke-test the actual release package (local providers only)
        run: pnpm test:release 2>&1 | tee "$RUNNER_TEMP/ci-diagnostics/smoke-release.log"
      - name: Upload tested distribution
        uses: actions/upload-artifact@v4
        with:
          name: distribution
          path: |
            release/local-ai-agent-harness-*.tgz
            release/*.zip
            release/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-packaging
          path: ${{ runner.temp }}/ci-diagnostics/*.log
          if-no-files-found: warn
          retention-days: 7
