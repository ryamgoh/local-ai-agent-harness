name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

# Serialize a tag's publication without cancelling an in-flight release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Verify release
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish immutable release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
      - name: Validate tag matches package and workspace versions
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const files = ['package.json', 'packages/core/package.json', 'packages/cli/package.json'];
          const versions = files.map((file) => JSON.parse(readFileSync(file, 'utf8')).version);
          if (versions.some((version) => version !== versions[0]) || process.env.RELEASE_TAG !== `v${versions[0]}`)
            throw new Error('Release tag must exactly match all host package versions');
          console.log(`Validated release ${process.env.RELEASE_TAG}`);
          JS
      - name: Download tested distribution
        uses: actions/download-artifact@v8
        with:
          name: distribution
          path: release/
      - name: Verify assets before publication
        run: |
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          package="release/local-ai-agent-harness-${version}.tgz"
          source_archives=(release/*.zip)
          [[ -f "$package" && -f release/SHA256SUMS ]]
          [[ ${#source_archives[@]} -eq 1 && -f "${source_archives[0]}" ]]
          [[ "$(find release -mindepth 1 -maxdepth 1 | wc -l)" -eq 3 ]]
          (cd release && sha256sum --check --strict SHA256SUMS)
      - name: Create release without overwriting tags or assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A rerun must fail instead of modifying an existing release, including a draft.
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to overwrite it." >&2
            exit 1
          fi
          version="$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')"
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tag = process.env.RELEASE_TAG;
          const repo = process.env.GH_REPO;
          const notes = [
            'Install with Node.js 22.22.2+ (Node 24 recommended). Private-repository access is required.',
            '',
            '```sh',
            `gh release download ${tag} --repo ${repo} --pattern 'local-ai-agent-harness-${version}.tgz'`,
            `npm install --global ./local-ai-agent-harness-${version}.tgz`,
            'harness --version',
            'harness --help',
            '```',
            '',
            `See [installation and upgrades](https://github.com/${repo}/blob/${tag}/docs/INSTALL.md).`,
            'No npm registry publication. Proof plugins remain opt-in. Python/uv and Ollama are optional until those capabilities are used.',
            'SHA256SUMS covers the package and source archive. Pre-1.0 APIs are experimental.',
            '',
          ].join('\n');
          writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, notes);
          JS
          gh release create "$RELEASE_TAG" \
            "release/local-ai-agent-harness-${version}.tgz" \
            release/*.zip \
            release/SHA256SUMS \
            --repo "$GH_REPO" \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes
